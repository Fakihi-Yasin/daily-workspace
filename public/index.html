<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today · Dashboard</title>
  <link rel="icon" href="/favicon.svg?v=green" type="image/svg+xml" />
  <script>
    // Apply the saved theme before first paint (no flash). "system" = follow the OS setting.
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
    { "imports": { "preact": "/vendor/preact.js", "preact/hooks": "/vendor/hooks.js", "htm": "/vendor/htm.js" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Enable JavaScript to use the dashboard.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
